[package]
name = "steamthrottle"
version = "0.1.2"
description = "A native Steam download throttler for League of Legends players."
authors = ["csmit195 and contributors"]
edition = "2024"
license = "MIT"
homepage = "https://github.com/csmit195/SteamThrottle"
repository = "https://github.com/csmit195/SteamThrottle"

[lib]
name = "steamthrottle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sysinfo = "0.37"
tokio = { version = "1", features = ["time"] }
windows-sys = { version = "0.61", features = [
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
strip = "symbols"
lto = "thin"
