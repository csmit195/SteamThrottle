name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: write
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Test frontend
        run: npm test

      - name: Check Svelte
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit

      - name: Enforce frontend bundle budget
        shell: pwsh
        run: |
          $bytes = (Get-ChildItem build -Recurse -File | Measure-Object Length -Sum).Sum
          if ($bytes -gt 1048576) { throw "Frontend bundle exceeds 1 MiB: $bytes bytes" }

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
