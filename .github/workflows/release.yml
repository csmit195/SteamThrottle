name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build a portable package for
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: npm ci
        working-directory: ui
      - uses: tauri-apps/tauri-action@v1
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: node ui/node_modules/@tauri-apps/cli/tauri.js
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Steam Throttle ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: false
      - name: Build portable executable
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./ui/node_modules/.bin/tauri.cmd build --no-bundle
      - name: Checkout release test harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tests
          sparse-checkout: scripts/smoke-release.mjs
          sparse-checkout-cone-mode: false
      - name: Verify release startup without a development server
        run: node .release-tests/scripts/smoke-release.mjs target/release/steamthrottle.exe
      - name: Package portable executable
        shell: pwsh
        run: |
          $archive = "SteamThrottle-$env:RELEASE_TAG-windows-x64-portable.zip"
          Compress-Archive -LiteralPath "target/release/steamthrottle.exe" -DestinationPath $archive
          gh release upload $env:RELEASE_TAG $archive --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
