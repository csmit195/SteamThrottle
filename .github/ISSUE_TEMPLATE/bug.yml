name: Bug report
description: Report an incorrect League state or Steam action
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove summoner names, Riot IDs, tokens, usernames, and personal paths before posting logs."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the League mode/state, displayed matched rule, desired action, and applied action.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SteamThrottle version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed identities, tokens, usernames, and personal paths.
          required: true
