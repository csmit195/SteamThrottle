name: Bug report
description: Report incorrect detection, Steam behavior, or an application error.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove Riot IDs, summoner names, tokens, account data, and personal paths before attaching logs.
  - type: input
    id: version
    attributes:
      label: Steam Throttle version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the League mode, detected state, expected Steam action, and actual Steam action.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots if useful.
